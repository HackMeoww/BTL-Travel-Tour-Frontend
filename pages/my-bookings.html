<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đơn đặt tour - Travel Tour</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container navbar">

            <div class="logo">
                Travel Tour
            </div>

            <nav class="menu">

                <a href="../index.html">
                    Trang chủ
                </a>

                <a href="tours.html">
                    Tour
                </a>

                <a href="my-bookings.html">
                    Đơn đặt tour
                </a>

                <a href="login.html" id="loginLink">
                    Đăng nhập
                </a>

                <a href="#" id="logoutLink" style="display: none;">
                    Đăng xuất
                </a>

            </nav>

        </div>
    </header>


    <!-- Danh sách booking -->
    <main>

        <section class="booking-page">

            <div class="container">

                <div class="section-title">

                    <h1>
                        Đơn đặt tour của tôi
                    </h1>

                    <p>
                        Xem và quản lý các tour đã đặt
                    </p>

                </div>


                <div id="bookingList">

                    <p>
                        Đang tải danh sách booking...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/api.js"></script>

    <script>

        // =========================
        // Kiểm tra đăng nhập
        // =========================

        const token =
            localStorage.getItem("token");

        const userData =
            localStorage.getItem("user");


        if (!token || !userData) {

            alert(
                "Bạn cần đăng nhập để xem đơn đặt tour."
            );

            window.location.href =
                "login.html";

        }


        const user =
            JSON.parse(userData);


        // =========================
        // Lấy danh sách Booking
        // =========================

        async function loadMyBookings() {

    const bookingList =
        document.getElementById("bookingList");

    try {

        // =========================
        // 1. Lấy danh sách Customer
        // =========================

        const customerResponse =
            await fetch(
                `${API_BASE_URL}/Customer`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!customerResponse.ok) {

            throw new Error(
                "Không thể lấy danh sách Customer"
            );

        }


        const customers =
            await customerResponse.json();


        // =========================
        // 2. Tìm Customer của User
        // =========================

        const customer =
            customers.find(
                c =>
                    Number(c.userId) ===
                    Number(user.userId)
            );


        if (!customer) {

            bookingList.innerHTML = `
                <div class="booking-form">

                    <h2>Chưa có thông tin khách hàng</h2>

                    <p>
                        Tài khoản này chưa được liên kết
                        với thông tin Customer.
                    </p>

                </div>
            `;

            return;

        }


        // Lấy CustomerId chính xác

        const customerId =
            customer.customerId;


        // Lưu lại vào localStorage
        // để những trang khác có thể sử dụng

        user.customerId =
            customerId;

        localStorage.setItem(
            "user",
            JSON.stringify(user)
        );


        // =========================
        // 3. Lấy danh sách Booking
        // =========================

        const bookingResponse =
            await fetch(
                `${API_BASE_URL}/Booking`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!bookingResponse.ok) {

            throw new Error(
                "Không thể lấy danh sách booking"
            );

        }


        const bookings =
            await bookingResponse.json();

// Lấy danh sách tour
const tourResponse = await fetch(
    `${API_BASE_URL}/Tour`,
    {
        headers: {
            "Authorization": `Bearer ${token}`
        }
    }
);

if (!tourResponse.ok) {
    throw new Error("Không thể lấy danh sách tour");
}

const tours = await tourResponse.json();

// Tạo danh sách tra cứu tour theo TourId
const tourMap = new Map(
    tours.map(tour => [Number(tour.tourId), tour])
);

        // =========================
        // 4. Lọc Booking của Customer
        // =========================

        const myBookings =
            bookings.filter(
                booking =>
                    Number(booking.customerId) ===
                    Number(customerId)
            );


        // =========================
        // 5. Không có Booking
        // =========================

        if (myBookings.length === 0) {

            bookingList.innerHTML = `

                <div class="booking-form">

                    <h2>
                        Chưa có đơn đặt tour
                    </h2>

                    <p>
                        Bạn chưa đặt tour nào.
                    </p>

                    <br>

                    <a href="tours.html">
                        Xem danh sách tour
                    </a>

                </div>

            `;

            return;

        }


        // =========================
        // 6. Hiển thị Booking
        // =========================

        bookingList.innerHTML = "";


        myBookings.forEach(
            booking => {

                const bookingItem =
                    document.createElement("div");


                bookingItem.className =
                    "booking-form";

const tour = tourMap.get(Number(booking.tourId));

const tourName = tour
    ? tour.tourName
    : `Tour #${booking.tourId}`;

const destination = tour
    ? tour.destination
    : "Chưa có thông tin";
                bookingItem.innerHTML = `

                    <h2>
                        Booking #${booking.bookingId}
                    </h2>


                    <div class="summary-item">
    <span>Tên tour</span>
    <strong>${tourName}</strong>
</div>

<div class="summary-item">
    <span>Điểm đến</span>
    <strong>${destination}</strong>
</div>


                    <div class="summary-item">

                        <span>
                            Số lượng
                        </span>

                        <strong>
                            ${booking.numberOfPeople}
                            người
                        </strong>

                    </div>


                    <div class="summary-item">

                        <span>
                            Tổng tiền
                        </span>

                        <strong>
                            ${formatPrice(
                                booking.totalPrice
                            )}
                        </strong>

                    </div>


                    <div class="summary-item">

                        <span>
                            Ngày đặt
                        </span>

                        <strong>
                            ${formatDate(
                                booking.bookingDate
                            )}
                        </strong>

                    </div>


                    <div class="summary-item">

                        <span>
                            Trạng thái
                        </span>

                        <strong>
                           ${formatBookingStatus(booking.status)}
                        </strong>

                    </div>


                    ${
                        booking.status !== "Cancelled" &&
                        booking.status !== "Refunded"
                        ?
                        `
                            <button
                                class="booking-button"
                                type="button"
                                onclick="cancelBooking(
                                    ${booking.bookingId}
                                )">

                                Hủy booking

                            </button>
                        `
                        :
                        ""
                    }

                `;


                
const pdfButton = document.createElement("button");

pdfButton.type = "button";
pdfButton.className = "booking-button";
pdfButton.textContent = "In hóa đơn";

pdfButton.addEventListener("click", function () {
    printBookingPDF({
        ...booking,
        tourName: tourName,
        destination: destination
    });
});

bookingItem.appendChild(pdfButton);


                



bookingList.appendChild(bookingItem);

            }
        );

    }
    catch (error) {

        console.error(error);

        bookingList.innerHTML = `

            <div class="booking-form">

                <h2>
                    Không thể tải đơn đặt tour
                </h2>

                <p>
                    Vui lòng kiểm tra Backend
                    và đăng nhập lại.
                </p>

            </div>

        `;

    }

}

        // =========================
        // Định dạng tiền
        // =========================

        function formatPrice(price) {

            return Number(price)
                .toLocaleString("vi-VN")
                + " VNĐ";

        }


        // =========================
        // Định dạng ngày
        // =========================

        function formatDate(date) {

            return new Date(date)
                .toLocaleString("vi-VN");

        }

// =========================
// Chuyển trạng thái sang tiếng Việt
// =========================

function formatBookingStatus(status) {
    const statuses = {
        Pending: "Đang chờ xử lý",
        Confirmed: "Đã xác nhận",
        Cancelled: "Đã hủy",
        Refunded: "Đã hoàn tiền"
    };

    return statuses[status] || status;
}

        // =========================
        // Đăng xuất
        // =========================

        const loginLink =
            document.getElementById("loginLink");

        const logoutLink =
            document.getElementById("logoutLink");


        if (token) {

            loginLink.style.display =
                "none";

            logoutLink.style.display =
                "inline-block";

        }


        logoutLink.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                localStorage.removeItem("token");
                localStorage.removeItem("user");
                localStorage.removeItem("booking");

                window.location.href =
                    "../index.html";

            }
        );


        // =========================
        // Chạy
        // =========================

        loadMyBookings();// =========================
// Hủy Booking
// =========================

// =========================
// Hủy Booking
// =========================

async function cancelBooking(bookingId) {

    const confirmCancel =
        confirm(
            "Bạn có chắc chắn muốn hủy booking này không?"
        );

    if (!confirmCancel) {
        return;
    }

    const token =
        localStorage.getItem("token");

    if (!token) {

        alert("Bạn cần đăng nhập.");

        window.location.href =
            "login.html";

        return;
    }

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/Booking/${bookingId}/cancel`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        // Đọc response dạng text trước
        const text =
            await response.text();


        console.log(
            "Cancel status:",
            response.status
        );

        console.log(
            "Cancel response:",
            text
        );


        // Nếu Backend trả lỗi
        if (!response.ok) {

            let message =
                "Hủy booking thất bại.";

            try {

                const data =
                    JSON.parse(text);

                message =
                    data.message || message;

            }
            catch (e) {
                // Response không phải JSON
            }

            alert(message);

            return;
        }


        // Backend trả thành công
        let message =
            "Hủy booking thành công!";

        if (text) {

            try {

                const data =
                    JSON.parse(text);

                message =
                    data.message || message;

            }
            catch (e) {
                // Không có JSON cũng không sao
            }

        }


        alert(message);


        // Tải lại danh sách booking
        await loadMyBookings();

    }
    catch (error) {

        console.error(
            "Lỗi hủy booking:",
            error
        );

        alert(
            "Không thể kết nối đến Backend."
        );

    }

}


function printBookingPDF(booking) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const formatPrice = price =>
        Number(price).toLocaleString("vi-VN") + " VNĐ";

    const bookingDate = booking.bookingDate
        ? new Date(booking.bookingDate).toLocaleDateString("vi-VN")
        : "Chưa có thông tin";

    const statusMap = {
        Pending: "Đang chờ xử lý",
        Confirmed: "Đã xác nhận",
        Cancelled: "Đã hủy",
        Refunded: "Đã hoàn tiền"
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("TRAVEL TOUR - HOA DON DAT TOUR", 20, 20);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);

    doc.text(`Ma booking: ${booking.bookingId}`, 20, 40);
    doc.text(`Ten tour: ${booking.tourName || "Tour du lich"}`, 20, 50);
    doc.text(`Diem den: ${booking.destination || "Chua co thong tin"}`, 20, 60);
    doc.text(`So nguoi: ${booking.numberOfPeople}`, 20, 70);
    doc.text(`Ngay dat: ${bookingDate}`, 20, 80);
    doc.text(`Tong tien: ${formatPrice(booking.totalPrice)}`, 20, 90);
    doc.text(
        `Trang thai: ${statusMap[booking.status] || booking.status}`,
        20, 100
    );

    doc.setFontSize(10);
    doc.text("Cam on quy khach da su dung dich vu Travel Tour!", 20, 120);

    doc.save(`HoaDon_Booking_${booking.bookingId}.pdf`);
}

    </script>

</body>

</html>
