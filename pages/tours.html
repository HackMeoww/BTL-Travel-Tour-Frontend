<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh sách Tour - Travel Tour</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container navbar">

            <div class="logo">
                Travel Tour
            </div>

            <nav class="menu">

    <a href="../index.html">
        Trang chủ
    </a>

    <a href="tours.html">
        Tour
    </a>

    <a href="login.html" id="loginLink">
        Đăng nhập
    </a>

    <a href="#" id="logoutLink" style="display: none;">
        Đăng xuất
    </a>

</nav>

        </div>
    </header>


    <!-- Danh sách tour -->
    <main>

        <section class="tour-page">

            <div class="container">

                <div class="section-title">
                    <h1>Danh sách Tour</h1>
                    <p>Khám phá những tour du lịch hấp dẫn</p>
                </div>


                <!-- Tour sẽ được lấy từ Backend -->
                <div class="tour-list" id="tourList">

                    <p>Đang tải danh sách tour...</p>

                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="../js/api.js"></script>

    <script>

        async function loadTours() {

            const tourList = document.getElementById("tourList");

            try {

                const tours = await getTours();

                tourList.innerHTML = "";

                if (tours.length === 0) {

                    tourList.innerHTML =
                        "<p>Hiện chưa có tour nào.</p>";

                    return;
                }


                tours.forEach(tour => {

                    const tourCard = document.createElement("div");

                    tourCard.className = "tour-card";


                    tourCard.innerHTML = `
                        
                        <div class="tour-image">
                            <span>${tour.destination}</span>
                        </div>

                        <div class="tour-info">

                            <h3>${tour.tourName}</h3>

                            <p class="destination">
                                📍 ${tour.destination}
                            </p>

                            <p>
                                ${tour.description}
                            </p>

                            <div class="tour-bottom">

                                <strong>
                                    ${Number(tour.price).toLocaleString("vi-VN")} VNĐ
                                </strong>

                                <button onclick="viewTour(${tour.tourId})">
                                    Xem chi tiết
                                </button>

                            </div>

                        </div>

                    `;

                    tourList.appendChild(tourCard);

                });

            }
            catch (error) {

                console.error(error);

                tourList.innerHTML = `
                    <p>
                        Không thể kết nối đến Backend.
                    </p>
                `;
            }
        }


        function viewTour(tourId) {

            window.location.href =
                `tour-detail.html?id=${tourId}`;

        }


        // Chạy khi mở trang
        loadTours();

    </script>
<script>

    const token = localStorage.getItem("token");

    const loginLink =
        document.getElementById("loginLink");

    const logoutLink =
        document.getElementById("logoutLink");


    if (token) {

        loginLink.style.display = "none";
        logoutLink.style.display = "inline-block";

    }
    else {

        loginLink.style.display = "inline-block";
        logoutLink.style.display = "none";

    }


    logoutLink.addEventListener("click", function (event) {

        event.preventDefault();

        localStorage.removeItem("token");
        localStorage.removeItem("user");
        localStorage.removeItem("booking");

        window.location.href = "../index.html";

    });

</script>
</body>

</html>
